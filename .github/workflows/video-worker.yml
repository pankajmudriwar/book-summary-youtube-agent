name: Video Worker Pipeline

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "UUID of the book to process"
        required: true
        type: string
      stages:
        description: "Comma-separated stages to run (voice,captions,render,upload) — blank = all"
        required: false
        type: string
        default: ""

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

jobs:
  process-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: worker/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          # Verify Noto Sans Devanagari is available for libass
          fc-list | grep -i "Noto Sans Devanagari" || echo "WARNING: Noto Sans Devanagari font not found"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Run Voice Cloner
        if: ${{ !inputs.stages || contains(inputs.stages, 'voice') }}
        run: python worker/voice_cloner.py --book-id "${{ inputs.book_id }}"

      - name: Run Caption Generator
        if: ${{ !inputs.stages || contains(inputs.stages, 'captions') }}
        run: python worker/caption_generator.py --book-id "${{ inputs.book_id }}"

      - name: Run Video Renderer
        if: ${{ !inputs.stages || contains(inputs.stages, 'render') }}
        run: python worker/video_renderer.py --book-id "${{ inputs.book_id }}"

      - name: Run YouTube Uploader
        if: ${{ !inputs.stages || contains(inputs.stages, 'upload') }}
        run: python worker/youtube_uploader.py --book-id "${{ inputs.book_id }}"

      - name: Report failure
        if: failure()
        run: python worker/report_failure.py --book-id "${{ inputs.book_id }}"
